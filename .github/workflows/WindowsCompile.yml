name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the build to (e.g. v0.9.0)"
        required: true
        default: "v0.9.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # NOTE: v4 action versions are intentional — v7/v6/v7 majors produced
      # "startup_failure" on windows-latest (2026-11-11). The Node 20
      # deprecation on v4 is a warning only and does not block the build.
      # Re-bump once the v7/v6/v7 startup issue is understood.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', 'src/**/*.rs', 'benches/**/*.rs', 'assets/**') }}

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $exe = "target/x86_64-pc-windows-msvc/release/zoneedit.exe"

          if (!(Test-Path $exe)) {
            throw "Executable not found: $exe"
          }

          if (!(Test-Path "LICENSE.md")) {
            throw "LICENSE.md not found"
          }

          Compress-Archive `
            -Path $exe, LICENSE.md `
            -DestinationPath "zoneedit-$tag-x86_64-pc-windows-msvc.zip" `
            -Force

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoneedit-windows
          path: "*.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"

          gh release view "$tag" 2>$null

          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" `
              --verify-tag `
              --title "zoneEDIT $tag" `
              --notes "Windows x64 build."

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub release."
            }
          }

          gh release upload "$tag" `
            "zoneedit-$tag-x86_64-pc-windows-msvc.zip" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release asset."
          }

          gh release view "$tag"
