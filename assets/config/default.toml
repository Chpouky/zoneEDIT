# Universal shops + faction traders (GeneralNPC_TradeItemGenerator and
# its _Bandit / _Duty / … variants) + the shared trader sub-pools and
# wandering-trader generators (first match wins, so the location rules
# above keep their own Trader* blocks).
[[rules]]
category = "UniversalOther"
delegations = "include"
block = { prefix = [
  "BartenderUniversal", "MedicUniversal", "MedicNoon", "GeneralNPC_TradeItemGenerator",
  "Trader", "AllTrader", "DynamicTrader", "RC_TraderNPC", "MainTraderItemGeneratorV1",
  "SvoraTrader", "VoentorgTrader", "SkadovskTrader",
] }

