# ---------------------------------------------------------------------------
# Classification rules, evaluated IN ORDER: the first match assigns the
# category (no match -> out-of-scope entry).
#
# Conditions (all must be true):
#   delegations        : "exclude" (default) | "include" | "only"
#   file_roles         : file role in the list
#   exclude_file_roles : file role outside the list
#   block / item       : matcher { exact, prefix, suffix, contains } — true
#                        if any list matches
#   exclude_block      : matcher — the rule is SKIPPED when the block matches
#   has_fields         : the entry carries at least one of these fields
# ---------------------------------------------------------------------------

# Anomalies: the whole `AnomalyPrototypes.cfg` file (one block = one entry).
[[rules]]
category = "Anomalies"
file_roles = ["anomalies"]

# World artifact spawners: one entry per rank scope.
[[rules]]
category = "ArtifactSpawner"
file_roles = ["artifact_spawner"]

# Weapon stats: one rule per stat family (the files are `multi_category`,
# so every weapon block belongs to ALL the families of its file).
[[rules]]
category = "WeaponFire"
file_roles = ["weapon_general"]

[[rules]]
category = "WeaponAiming"
file_roles = ["weapon_general"]

[[rules]]
category = "WeaponRecoil"
file_roles = ["weapon_general"]

[[rules]]
category = "WeaponJams"
file_roles = ["weapon_general"]

[[rules]]
category = "WeaponReload"
file_roles = ["weapon_general"]

[[rules]]
category = "WeaponHeating"
file_roles = ["weapon_general"]

[[rules]]
category = "PlayerWeaponDamage"
file_roles = ["weapon_player"]

[[rules]]
category = "PlayerWeaponDisplay"
file_roles = ["weapon_player"]

[[rules]]
category = "NpcWeaponCombat"
file_roles = ["weapon_npc"]

# World NPC loadouts: grouped by faction block, whatever the item.
# Trade blocks are excluded (they live in the TRADERS section below).
[[rules]]
category = "NpcLoadout"
file_roles = ["dynamic_npc"]
block = { prefix = ["GeneralNPC", "GuardNPC", "GeneralZombie", "Duga_", "Granit_"] }
exclude_block = { contains = ["Trade", "trader"] }

# Breakable medical crates (delegations included).
[[rules]]
category = "MedCrate"
delegations = "include"
block = { exact = [
  "DestructibleStash_Medkit_Newbie",
  "DestructibleStash_Medkit_Experienced",
  "DestructibleStash_Medkit_Veteran",
  "DestructibleStash_Medkit_Master",
  "DestructibleStash_Med",
  "DestructibleStash_Med_Experienced",
  "DestructibleStash_Med_Veteran",
  "DestructibleStash_Med_Master",
  "DestructibleStashProlog_Med",
] }

[[rules]]
category = "MedStash"
block = { prefix = ["StashMedicine"] }

[[rules]]
category = "AmmoGenerator"
block = { exact = ["AllAmmosGenerator", "AllAmmosNPCGenerator", "CommonCacheAmmoGenerator"] }

[[rules]]
category = "AmmoSmart"
file_roles = ["stashes"]
block = { exact = [
  "Stash_AmmoAll_Cheap",
  "Stash_AmmoNATO_Smart",
  "Stash_AmmoSNG_Smart",
  "Stash_AmmoNATO_Smart_MainLoot",
  "Stash_AmmoSNG_Smart_MainLoot",
  "Stash_Ammo_Smart_Cheap",
  "Stash_Ammo_Smart_CommonRare",
  "NPC_Ammo_Smart",
] }

# Direct spawn (player / main NPC). Both spellings AntiRad /
# Antirad exist in the data.
[[rules]]
category = "MedDirect"
block = { exact = ["PlayerItemGenerator", "MainNPCItemGenerator", "GameStartPlayerItemGenerator"] }
item = { exact = ["Medkit", "ArmyMedkit", "EcoMedkit", "Bandage", "AntiRad", "Antirad"] }

[[rules]]
category = "AmmoLoot"
block = { exact = ["PlayerItemGenerator", "MainNPCItemGenerator", "GameStartPlayerItemGenerator"] }
item = { exact = [
  "A918D", "A918A", "A045D", "A045A", "A045E", "A919D", "A919A",
  "A545D", "A545A", "A545E", "A939D", "A939A", "A939S", "A939E",
  "A556D", "A556A", "A556S", "A556E", "A762SniperD", "A762SniperA",
  "A762SniperS", "A012D", "A012A", "A012E", "A762NATOD", "A762NATOA", "A762NATOS",
] }

# Weapons: entries carrying AmmoMinCount / AmmoMaxCount (no stashes).
[[rules]]
category = "AmmoWeapon"
exclude_file_roles = ["stashes"]
has_fields = ["AmmoMinCount", "AmmoMaxCount"]
exclude_block = { contains = ["Trade", "trader"] }

# Item families by name. Order matters: the quest patterns are the
# widest (a quest armor also carries the _Armor suffix).
# Trade blocks are excluded (TRADERS section): every family rule below
# carries the same `exclude_block`.
[[rules]]
category = "Quest"
item = { prefix = ["Blueprint_"], suffix = ["PDA"], contains = ["_Key_", "Note", "Docs"], exact = [
  "Electrocollar",
  "QuestArtifactHeartofChornobyl",
  "E07_MQ01PsySuit",
  "GuardQuestItem",
  "DvupalovVodka",
  "SuppressorDevicePart",
  "E03_02_OldTechDocs_X18",
] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Artifact"
item = { prefix = ["CArtifact", "FArtifact", "GArtifact", "EArtifact", "AArtifact"] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Food"
item = { exact = ["Bread", "Sausage", "CannedFood", "Vodka", "Beer", "Water", "Milk", "Energetic"] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Grenade"
item = { exact = ["GrenadeF1", "GrenadeRGD5"] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Loot"
item = { exact = [
  "DeerLoot", "BoarLoot", "CatLoot", "ChimeraLoot", "BloodsuckerLoot",
  "PseudodogLoot", "PseudogiantLoot", "FleshLoot", "ControllerLoot",
  "PoltergeistLoot", "BurerLoot", "SnorkLoot", "TushkanLoot", "BlinddogLoot",
] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Armor"
item = { suffix = ["_Armor", "_Helmet"], prefix = ["NVG_", "Binoculars_"] }
exclude_block = { contains = ["Trade", "trader"] }

# Anomaly detectors (Gilka / Veles / Echo / Oko / Bear).
[[rules]]
category = "Detectors"
item = { exact = ["Gilka", "Veles", "Echo", "Oko", "Bear"] }
exclude_block = { contains = ["Trade", "trader"] }

[[rules]]
category = "Attach"
item = { prefix = ["RU_", "EN_"], exact = ["Hercules", "DetectorGilka"] }
exclude_block = { contains = ["Trade", "trader"] }

# ---------------------------------------------------------------------------
# TRADERS page: one rule per location (first match wins; the item-family
# rules above carry `exclude_block` for trade blocks). `delegations =
