# zoneEDIT — configuration par défaut (embarquée dans l'exécutable).
#
# Surcharge : déposer un fichier `zoneedit.toml` à la racine du mod (dossier
# qui contient `GameData/`). Il est fusionné par-dessus celui-ci : les tables
# sont fusionnées clé par clé, les tableaux (listes, `[[...]]`) sont
# REMPLACÉS en entier.

[project]
# Folders relative to the mod root.
presets_dir = "presets"

# ---------------------------------------------------------------------------
# Fichiers chargés. Le premier sert de marqueur pour détecter la racine.
# `role` est l'identifiant utilisé par les règles de classification.
# ---------------------------------------------------------------------------
[[files]]
path = "GameData/ItemGeneratorPrototypes.cfg"
name = "ItemGeneratorPrototypes"
role = "item_generators"

[[files]]
path = "GameData/ItemGeneratorPrototypes/DynamicItemGenerator.cfg"
name = "DynamicItemGenerator"
role = "dynamic_npc"

[[files]]
path = "GameData/ItemGeneratorPrototypes/QuestItemGeneratorPrototypes.cfg"
name = "QuestItemGenerator"
role = "quest"

[[files]]
path = "GameData/StashPrototypes.cfg"
name = "StashPrototypes"
role = "stashes"

[[files]]
path = "GameData/AnomalyPrototypes.cfg"
name = "AnomalyPrototypes"
role = "anomalies"

# World artifact spawners: one sub-block per rank (Newbie / …).
[[files]]
path = "GameData/ArtifactSpawnerPrototypes.cfg"
name = "ArtifactSpawnerPrototypes"
role = "artifact_spawner"

# Weapon stats (one block = one weapon; `multi_category`: each weapon shows
# in several "Weapons" rows of the sidebar).
[[files]]
path = "GameData/WeaponData/WeaponGeneralSetupPrototypes.cfg"
name = "WeaponGeneralSetup"
role = "weapon_general"
multi_category = true

[[files]]
path = "GameData/WeaponData/CharacterWeaponSettingsPrototypes/PlayerWeaponSettingsPrototypes.cfg"
name = "PlayerWeaponSettings"
role = "weapon_player"
multi_category = true

[[files]]
path = "GameData/WeaponData/CharacterWeaponSettingsPrototypes/NPCWeaponSettingsPrototypes.cfg"
name = "NPCWeaponSettings"
role = "weapon_npc"
multi_category = true

# ---------------------------------------------------------------------------
# Lecture des structures (noms de clés du format cfg du jeu).
# ---------------------------------------------------------------------------
[parser]
item_key = "ItemPrototypeSID"            # opens an "item" entry
delegation_key = "ItemGeneratorPrototypeSID"  # opens a "delegation" entry
empty_value = "empty"                    # value that opens nothing
block_sid_key = "SID"                    # renames a level-1 `[N]` block
rank_keys = ["Rank", "PlayerRank"]
caliber_key = "PriorityCaliber"
none_value = "None"                      # "absent" caliber
itemset_key = "ItemSetCount"             # marks a consumables set
block_entry_roles = ["anomalies", "weapon_general", "weapon_player", "weapon_npc"]
# roles where the block IS the entry
# Roles where a scope named after a rank (Newbie / …) opens an entry for
# the whole block, scoped to that rank.
rank_scope_roles = ["artifact_spawner"]
# Scope listing the items a spawner spawns: the first SID is the row's icon.
icon_list_scope = "ListOfArtifacts"

# cfg key aliases: alias -> canonical key.
# - `weight` (lowercase) is used by some generators (e.g.
#   AttachNewbieGenerator) where the key is `Weight`;
# - `AmmoMaxcount` (lowercase `c`) is the same misspelling family, used by a
#   few NPC loadouts where the key is `AmmoMaxCount`;
# - `Count` is the per-rank spawn count in ArtifactSpawnerPrototypes.cfg
#   (kind `ArtifactCount`, to not clash with MinCount/MaxCount).
# The exported patch keeps the original key as written in the file.
[parser.aliases]
weight = "Weight"
AmmoMaxcount = "AmmoMaxCount"
Count = "ArtifactCount"
Common = "RarityChanceCommon"
Uncommon = "RarityChanceUncommon"
Rare = "RarityChanceRare"
Epic = "RarityChanceEpic"

# Scope -> section label (context of the NPC weapon entries).
[parser.sections]
PrimaryWeaponParams = "Primary"
SecondaryWeaponParams = "Secondary"
PistolWeaponParams = "Pistol"
MeleeWeaponParams = "Melee"

# Rangs de difficulté (valeurs de l'enum ERank, sans préfixe), dans l'ordre.
[ranks]
values = ["Newbie", "Experienced", "Veteran", "Master"]

# ---------------------------------------------------------------------------
# Champs éditables.
#   type    : "int" | "float"
#   min/max : bornes de validation (optionnelles)
#   display : "raw" | "percent" (saisie/affichage en %, stockage en [0, 1]f)
#   scope   : "entry" (porté par l'item) | "group" (partagé par le calibre / set)
# ---------------------------------------------------------------------------
[[fields]]
kind = "Weight"
short = "W"
long = "Weight"
type = "float"
min = 0

[[fields]]
kind = "Chance"
short = "C"
long = "Chance"
type = "float"   # poids relatif (données : 10, 100.0…) : pas borné à 1
min = 0

[[fields]]
kind = "MinCount"
short = "Min"
long = "Min Count"
type = "int"
min = 0

[[fields]]
kind = "MaxCount"
short = "Max"
long = "Max Count"
type = "int"
min = 0

[[fields]]
kind = "AmmoMinCount"
short = "Amin"
long = "Ammo Min"
type = "int"
min = 0

[[fields]]
kind = "AmmoMaxCount"
short = "Amax"
long = "Ammo Max"
type = "int"
min = 0

# Durability range of a spawned weapon (0..1 fraction of the max durability).
[[fields]]
kind = "MinDurability"
short = "Dmin"
long = "Min Dur"
type = "float"
min = 0
max = 1

[[fields]]
kind = "MaxDurability"
short = "Dmax"
long = "Max Dur"
type = "float"
min = 0
max = 1

[[fields]]
kind = "MainWeaponAmmoCount"
short = "MainAmmo"
long = "Main Ammo"
type = "int"
min = 0
scope = "group"

# Header labels (`long`) are painted centered on the ~70 px column grid:
# keep them short (the modal shows the full `short` name). The " %" suffix
# is appended automatically for percent fields — headers read "MIN %" /
# "MAX %" next to "Min Count" / "Max Count" on the stash pages.
[[fields]]
kind = "MinSpawnChance"
short = "Min spawn chance"
long = "Min"
type = "float"
min = 0
max = 1
display = "percent"
scope = "group"

[[fields]]
kind = "MaxSpawnChance"
short = "Max spawn chance"
long = "Max"
type = "float"
min = 0
max = 1
display = "percent"
scope = "group"

