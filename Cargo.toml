[package]
name = "zoneedit"
version = "0.10.0"
license = "MIT"
edition = "2021"
rust-version = "1.82"
description = "Éditeur desktop des valeurs de spawn S.T.A.L.K.E.R. 2 (fichiers .cfg)"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
uninlined_format_args = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Lean debug builds: line tables only for our code, no debug info at all
# for dependencies (they are optimized anyway, for smooth UI).
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

